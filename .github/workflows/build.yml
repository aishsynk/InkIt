name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build ScreenCanvas.slnx -c Release
      - name: Run InkIt checks
        run: dotnet run --project tests/InkIt.Tests -c Release --no-build
